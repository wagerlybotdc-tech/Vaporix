name: Build Vaporix APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q Vaporix-project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create signing key
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        working-directory: vaporix
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Vaporix-APK
          path: vaporix/app/build/outputs/apk/release/*.apk
